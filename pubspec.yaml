name: flutter_splash
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/image.png 
    - assets/images/
    - assets/fonts/Renogare.otf
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Bold.ttf
    - assets/fonts/Poppins-Medium.ttf


  fonts:
    - family: Renogare  # ✅ Font Family Name
      fonts:
        - asset: assets/fonts/Renogare.otf 
    - family: Poppins
      fonts:    
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf 
          weight: 500
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700      

flutter_native_splash:
  color: "#FFB6C1"  # Background color (Change to your desired color)
  image: assets/image.png  # Your splash screen image (Add your logo)
  android_12:
    image: assets/image.png
    icon_background_color: "#FFB6C1"


